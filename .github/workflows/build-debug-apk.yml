name: Build debug APK

on:
  push:
    branches: [dev]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with core submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 2 -name sdkmanager -type f | sort -V | tail -1)
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37" || true
          # No explicit buildToolsVersion is pinned in the Gradle config, so the Android
          # Gradle Plugin resolves and downloads a compatible build-tools version itself
          # during the Gradle build, now that licenses are pre-accepted above.

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # AGP's default debug signing uses a per-machine ~/.android/debug.keystore that it
      # generates on first use with a RANDOM key. A fresh GitHub Actions runner has none, so
      # every run would sign the APK differently — installing over yesterday's build then
      # fails with INSTALL_FAILED_UPDATE_INCOMPATIBLE, forcing a full uninstall/reinstall
      # (losing YouTube login, playlists, downloads) on every iteration. Cache one keystore
      # across runs instead, keyed on a fixed name so it's created once and reused forever.
      - name: Restore/create stable debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Generate debug keystore if not cached yet
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Assemble debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find androidApp/build/outputs/apk -name "*.apk" -print -quit)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found under androidApp/build/outputs/apk" >&2
            exit 1
          fi
          # Give the uploaded/released file a fixed, human-friendly name instead of
          # AGP's default (androidApp-debug.apk) so the download link and the file
          # on the phone both read "DeepDive", not an internal module name.
          RENAMED_PATH="$(dirname "$APK_PATH")/DeepDive.apk"
          cp "$APK_PATH" "$RENAMED_PATH"
          echo "path=$RENAMED_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ steps.find_apk.outputs.path }}
          if-no-files-found: error

      # A one-tap download link that works from a phone browser with no GitHub login and
      # no hunting through the Actions UI: this moves the same APK to a GitHub Release,
      # whose asset URLs are public. "latest-debug" is a single rolling release — each
      # build replaces its asset instead of creating a new release, so the same short URL
      # (…/releases/download/latest-debug/DeepDive.apk) always serves the newest build.
      - name: Publish rolling release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug "${{ steps.find_apk.outputs.path }}" \
            --title "DeepDive (latest debug build)" \
            --notes "Automatically built from the latest commit on \`dev\` (${{ github.sha }}). Always the newest build — download DeepDive.apk below."
